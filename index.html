<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Memory Game</title>

<style>

@keyframes pop {
  0% { transform: scale(0); opacity: 1; }
  100% { transform: scale(1.8); opacity: 0; }
}

body{
  font-family: Arial, sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  margin:0;
  padding:0;
  background:#f0f8ff;
}

h1{ color:#ff6f61; margin:10px; }

#controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
  margin-bottom:10px;
}

#game-board{
  display:grid;
  gap:6px;
  width:95vw;
  height:65vh;
  perspective:1000px;
}

.card{
  width:100%;
  height:100%;
  position:relative;
  cursor:pointer;
  transform-style:preserve-3d;
  transition:transform 0.6s;
}

.card-inner{
  position:absolute;
  width:100%;
  height:100%;
  transform-style:preserve-3d;
  transition:transform 0.6s;
}

.card.flipped .card-inner{
  transform:rotateY(180deg);
}

.card-front,
.card-back{
  position:absolute;
  width:100%;
  height:100%;
  backface-visibility:hidden;
  border-radius:10px;
}

.card-front{ background:#ffcc00; }
.card-back{ background:#4caf50; transform:rotateY(180deg); }

.card-back img{
  width:100%;
  height:100%;
  object-fit:contain;
}

#winMessage{
  font-size:2rem;
  color:green;
  display:none;
}
</style>
</head>

<body>

<h1>Memory Game</h1>

<div id="controls">
<select id="difficulty">
  <option value="4">Easy (4 pairs)</option>
  <option value="8" selected>Medium (8 pairs)</option>
  <option value="16">Hard (16 pairs)</option>
</select>

<div id="timer">Time: 0s</div>
<div id="score">Score: 0/16</div>
<button id="resetBtn">Reset</button>
</div>

<div id="winMessage">🎉 YOU WIN! 🎉</div>
<div id="game-board"></div>
<canvas id="confettiCanvas" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;"></canvas>

<script>

  let cards=[];
  let totalPairs=8;
  let maxAvailablePairs=16; // how many pairs exist in your images folder
  let activeCards=[];
  let lock=false;
  let time=0;
  let score=0;
  let timerInterval=null;
  let timerStarted=false;
  
  const matchSound=new Audio("sounds/match.mp3");
  const wrongSound=new Audio("sounds/wrong.mp3");
  
  const board=document.getElementById("game-board");
  const timerDisplay=document.getElementById("timer");
  const scoreDisplay=document.getElementById("score");
  const winMessage=document.getElementById("winMessage");
  
  /* =========================
     CONFETTI
  ========================= */
  
  function startConfetti(){
    const canvas=document.getElementById("confettiCanvas");
    const ctx=canvas.getContext("2d");
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
  
    const pieces=[];
    for(let i=0;i<150;i++){
      pieces.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        r:Math.random()*6+4,
        d:Math.random()*canvas.height,
        color:`hsl(${Math.random()*360},100%,50%)`
      });
    }
  
    let angle=0;
    function draw(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      pieces.forEach(p=>{
        ctx.beginPath();
        ctx.fillStyle=p.color;
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2,false);
        ctx.fill();
        p.y+=Math.cos(angle+p.d)+2;
        p.x+=Math.sin(angle);
        if(p.y>canvas.height){
          p.y=0;
          p.x=Math.random()*canvas.width;
        }
      });
      angle+=0.01;
      requestAnimationFrame(draw);
    }
    draw();
  }
  
  /* =========================
     STAR EFFECT
  ========================= */
  
  function showStar(card){
    const star=document.createElement("div");
    star.innerText="⭐";
    star.style.position="absolute";
    star.style.fontSize="30px";
    star.style.top="40%";
    star.style.left="40%";
    star.style.pointerEvents="none";
    star.style.animation="pop 0.8s ease-out";
    card.appendChild(star);
    setTimeout(()=>{ star.remove(); },800);
  }
  
  /* =========================
     SHUFFLE FUNCTION
  ========================= */
  
  function shuffle(array){
    for(let i=array.length-1;i>0;i--){
      let j=Math.floor(Math.random()*(i+1));
      [array[i],array[j]]=[array[j],array[i]];
    }
  }
  
  /* =========================
     RANDOM PAIR SELECTION
  ========================= */
  
  function generateCards(pairCount){
  
    cards=[];
  
    // Create array [1,2,3,...maxAvailablePairs]
    let available=[];
    for(let i=1;i<=maxAvailablePairs;i++){
      available.push(i);
    }
  
    // Shuffle available pairs
    shuffle(available);
  
    // Take only needed amount
    let selected=available.slice(0,pairCount);
  
    // Create 1 + 1b system
    selected.forEach(num=>{
      cards.push(String(num));
      cards.push(String(num)+"b");
    });
  
    // Shuffle final cards
    shuffle(cards);
  }
  
  /* =========================
     TIMER
  ========================= */
  
  function startTimer(){
    timerInterval=setInterval(()=>{
      time++;
      timerDisplay.innerText="Time: "+time+"s";
    },1000);
  }
  
  /* =========================
     GRID
  ========================= */
  
  function updateGrid(){
    if(totalPairs===4){
      board.style.gridTemplateColumns="repeat(4,1fr)";
    }
    else if(totalPairs===8){
      board.style.gridTemplateColumns="repeat(4,1fr)";
    }
    else{
      board.style.gridTemplateColumns="repeat(6,1fr)";
    }
  }
  
  /* =========================
     CREATE BOARD
  ========================= */
  
  function createBoard(){
    board.innerHTML="";
    generateCards(totalPairs);
    updateGrid();
  
    cards.forEach(num=>{
      const card=document.createElement("div");
      card.classList.add("card");
      card.style.position="relative";
  
      const inner=document.createElement("div");
      inner.classList.add("card-inner");
  
      const front=document.createElement("div");
      front.classList.add("card-front");
  
      const back=document.createElement("div");
      back.classList.add("card-back");
  
      const img=document.createElement("img");
      img.src="images/"+num+".png";
  
      back.appendChild(img);
      inner.appendChild(front);
      inner.appendChild(back);
      card.appendChild(inner);
  
      card.dataset.value=num;
      card.addEventListener("click",flipCard);
  
      board.appendChild(card);
    });
  
    scoreDisplay.innerText="Score: 0/"+totalPairs;
  }
  
  /* =========================
     FLIP LOGIC
  ========================= */
  
  function flipCard(){
    if(lock || this.classList.contains("flipped") || this.style.visibility==="hidden") return;
  
    if(!timerStarted){
      startTimer();
      timerStarted=true;
    }
  
    this.classList.add("flipped");
    activeCards.push(this);
  
    if(activeCards.length===2){
      lock=true;
  
      const [cardA,cardB]=activeCards;
  
      const baseA=cardA.dataset.value.replace("b","");
      const baseB=cardB.dataset.value.replace("b","");
  
      if(baseA===baseB){
  
        matchSound.currentTime=0;
        matchSound.play();
  
        showStar(cardA);
        showStar(cardB);
  
        setTimeout(()=>{
  
          cardA.style.opacity="0";
          cardB.style.opacity="0";
  
          setTimeout(()=>{
            cardA.style.visibility="hidden";
            cardB.style.visibility="hidden";
          },1000);
  
          score++;
          scoreDisplay.innerText="Score: "+score+"/"+totalPairs;
  
          if(score===totalPairs){
            clearInterval(timerInterval);
            winMessage.style.display="block";
            startConfetti();
          }
  
          activeCards=[];
          lock=false;
  
        },1500);
  
      }else{
  
        wrongSound.currentTime=0;
        wrongSound.play();
  
        setTimeout(()=>{
          cardA.classList.remove("flipped");
          cardB.classList.remove("flipped");
          activeCards=[];
          lock=false;
        },1000);
      }
    }
  }
  
  /* =========================
     RESET
  ========================= */
  
  function resetGame(){
    score=0;
    time=0;
    timerStarted=false;
    clearInterval(timerInterval);
    timerDisplay.innerText="Time: 0s";
    winMessage.style.display="none";
    createBoard();
  }
  
  /* =========================
     EVENTS
  ========================= */
  
  document.getElementById("resetBtn").addEventListener("click",resetGame);
  
  document.getElementById("difficulty").addEventListener("change",function(){
    totalPairs=parseInt(this.value);
    resetGame();
  });
  
  window.addEventListener("resize",updateGrid);
  
  resetGame();
  
  </script>

</body>
</html>
